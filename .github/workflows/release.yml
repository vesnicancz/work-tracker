name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: Release

jobs:
  verify-tag:
    name: Verify tag format
    runs-on: ubuntu-latest
    steps:
      # MinVer only recognises a three-part version tag. It ignores anything else and falls back to
      # the previous tag plus a patch bump, silently: v1.14 went out labelled 1.13.1, and every
      # installed copy kept offering itself as an update. Catch it here, in seconds, rather than
      # after nine publish jobs have built archives under the wrong number.
      - name: Check the tag is a three-part version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a three-part version tag, so MinVer ignores it and the release would be published under the previous tag's number. Delete it, then tag vMAJOR.MINOR.PATCH (for example v1.15.0) and push again."
            exit 1
          fi
          echo "Tag '$TAG' is a three-part version tag."

  test:
    name: Run tests
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c ${{ env.CONFIGURATION }}

      - name: Test
        run: dotnet test --no-build -c ${{ env.CONFIGURATION }}

  publish-cli:
    name: Publish CLI (${{ matrix.rid }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      # Without this a single broken RID cancels every sibling mid-restore, and the log then blames
      # the cancellation rather than the one job that actually failed.
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            artifact: WorkTracker-CLI-win-x64
          - rid: linux-x64
            artifact: WorkTracker-CLI-linux-x64
          - rid: osx-x64
            artifact: WorkTracker-CLI-osx-x64
          - rid: osx-arm64
            artifact: WorkTracker-CLI-osx-arm64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: >
          dotnet publish src/WorkTracker.CLI/WorkTracker.CLI.csproj
          -c ${{ env.CONFIGURATION }}
          -r ${{ matrix.rid }}
          -p:SelfContained=false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o publish/${{ matrix.artifact }}

      - name: Archive
        run: |
          cd publish/${{ matrix.artifact }}
          zip -r ../${{ matrix.artifact }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: publish/${{ matrix.artifact }}.zip

  publish-avalonia:
    name: Publish Avalonia (${{ matrix.rid }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            artifact: WorkTracker-Avalonia-win-x64
          - rid: linux-x64
            os: ubuntu-latest
            artifact: WorkTracker-Avalonia-linux-x64
          - rid: osx-x64
            os: macos-latest
            artifact: WorkTracker-Avalonia-osx-x64
          - rid: osx-arm64
            os: macos-latest
            artifact: WorkTracker-Avalonia-osx-arm64
          - rid: win-arm64
            os: windows-latest
            artifact: WorkTracker-Avalonia-win-arm64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: >
          dotnet publish src/WorkTracker.Avalonia/WorkTracker.Avalonia.csproj
          -c ${{ env.CONFIGURATION }}
          -r ${{ matrix.rid }}
          -p:SelfContained=false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o publish/${{ matrix.artifact }}

      # macOS gets the published output wrapped in an .app bundle: Finder and the Dock take the
      # name and icon from it, the tray item and the notification backend both need its bundle
      # identifier, and Apple Silicon refuses to launch an unsigned binary at all. The signature
      # is ad-hoc — see build/macos/make-app-bundle.sh for what a Developer ID would change.
      - name: Bundle and sign .app (macOS)
        if: runner.os == 'macOS'
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: >
          build/macos/make-app-bundle.sh
          publish/${{ matrix.artifact }}
          publish/bundle/WorkTracker.app
          "$VERSION_TAG"

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: |
          cd publish/${{ matrix.artifact }}
          zip -r ../${{ matrix.artifact }}.zip .

      # ditto rather than zip: it is what keeps the bundle's symlinks, and with them the code
      # signature, intact through the archive.
      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent publish/bundle/WorkTracker.app publish/${{ matrix.artifact }}.zip

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path publish/${{ matrix.artifact }}/* -DestinationPath publish/${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: publish/${{ matrix.artifact }}.zip

  publish-plugins:
    name: Publish Plugin (${{ matrix.plugin }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - plugin: Atlassian
            project: plugins/WorkTracker.Plugin.Atlassian/WorkTracker.Plugin.Atlassian.csproj
            artifact: WorkTracker.Plugin.Atlassian
          - plugin: Luxafor
            project: plugins/WorkTracker.Plugin.Luxafor/WorkTracker.Plugin.Luxafor.csproj
            artifact: WorkTracker.Plugin.Luxafor
          - plugin: GoranG3
            project: plugins/WorkTracker.Plugin.GoranG3/WorkTracker.Plugin.GoranG3.csproj
            artifact: WorkTracker.Plugin.GoranG3
          - plugin: Office365Calendar
            project: plugins/WorkTracker.Plugin.Office365Calendar/WorkTracker.Plugin.Office365Calendar.csproj
            artifact: WorkTracker.Plugin.Office365Calendar
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: >
          dotnet publish ${{ matrix.project }}
          -c ${{ env.CONFIGURATION }}
          -p:DebugType=none
          -o publish/${{ matrix.artifact }}

      - name: Archive
        run: |
          cd publish
          zip -r ${{ matrix.artifact }}.zip ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: publish/${{ matrix.artifact }}.zip

  release:
    name: Create GitHub Release
    needs: [publish-cli, publish-avalonia, publish-plugins]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*.zip
