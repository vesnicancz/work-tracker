# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Without this the job inherits the six-hour default. A run that hung in Actions sat there for
    # eleven minutes looking like a test failure while the log stayed unavailable, and it would have
    # kept the slot for the rest of the day before failing. The whole job takes about a minute, so
    # ten leaves room for a slow runner and still gives up on a hang the same morning.
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal

  # The repository's ruleset requires a check named "build", and a matrix job reports one check per
  # platform under other names. always() and the explicit result matter: a job skipped because the
  # one it needs failed counts as passed for a required check, so failing tests wouldn't block a merge.
  build:

    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Require all platforms to pass
      run: test "${{ needs.test.result }}" = "success"

  streamdeck-plugin:

    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: streamdeck-plugin

    steps:
    - uses: actions/checkout@v6
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Install dependencies
      run: npm ci --ignore-scripts
    - name: Test
      run: npm test
    # The manifest refers to the built plugin, so validating needs the build first
    - name: Build
      run: npm run build
    - name: Validate manifest
      run: npm run validate
